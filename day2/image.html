<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <!-- Image Tag - Adding Image on webpage img tab src-"Copy address" source/location -->
    <!-- 1. From Internet - copy image address and use it -->
    <!-- 1. pexels or unsplash -->
     <h2>Coffee</h2>
     <img src="https://images.pexels.com/photos/29849772/pexels-photo-29849772.jpeg" height="400" width="400">

     <hr>

     <!-- 2. Download and add from your system -->
      <h2>Headphones</h2>
      <img src="headphones.avif" height="400" width="400">

      <hr>

      <h2>Bike</h2>
      <img src="bike.jpg" height="400" width="400">

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Array - It is used To Store Multiple Data/Value At the Same Time
        // Advantage in Js Array - Can of Different Data Types Together 
        // Symbol - [ ] Square Bracket

        // Rule : Index No Start with 0

        let students = [ "Abhinav", "vaishnavi", "Piyush", "Rohini", "Ayushi" ]
        console.log(students)

        // Access a Single Data From Array
        // ArrayName[Indexno]

        console.log(students[4])

        // Products
        let products = [ "Mobile", "Laptop", "TV", "Fridge", "Washing Machine" ]
        console.log(products)

        // Object - It is used to Store Multiple Data/Value At the Same Time
        // Collection Data
        // Format : key(Left):value(Right) Pair
        // Symbol - { Curly Bracket }

        let employee1 = {

            // key:value
            name:"Aditya",
            email:"aditya@gmail.com",
            id:1234,
            salary:60000

        }

        // How to Access The Value in Object : objectName.keyName
        console.log(employee1.email)

    </script>
</body>
</html>

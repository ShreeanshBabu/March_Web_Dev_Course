<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Variable - It is used to store the data
        // Trick - "Text Format Data" or ''
        //         Number Format Data Write Directly

        // 1. keyword - var
        // Syntax VariableType VariableName = Value

        var username = "Shreeansh"
        console.log(username)

        var age = 22
        console.log(age)

        // Disadvantage of var keyword - It Allows using same Variable Name and Updates the Previous Value

        var phoneno = 12345678

        var phoneno = 89676

        console.log(phoneno)


        // 2. Keyword - let

        let email = "abc@gmail.com"

        // let email = "xyz@gmail.com" - Throw Error Bcz using same variableName that is email along with let

        console.log(email)

        // Disadvantage - If you used the same variableName without using let keyword it will update the valve 

        let review = 4.5

        review = 2.5

        console.log(review)

        // 3. keyword - const means constant - fixed 

        const abc = "Hello Guys"

        console.log(abc)

    </script>
</body>
</html>

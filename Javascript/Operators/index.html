<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Arithmetic Operators - +, -, /, *, %

        var x = 10
        var y = 7

        console.log(x+y)
        console.log(x-y)
        console.log(x/y)
        console.log(x*y)
        console.log(x%y)

        // Modulo - Reminder

        console.log(10%5)    //Remainder - 0

        console.log(12%5)    //Remainder - 2

        // Left Number is Smaller Than Right Number in Modulo output - LEFT Number  
        console.log(2%9)   // 2

        console.log(1%9)   // 1
        
    </script>
</body>
</html>
